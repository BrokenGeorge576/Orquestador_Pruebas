<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orquestador</title>
<style>
  :root {
    --bg:        #0d0d0f;
    --surface:   #141416;
    --surface2:  #1c1c1f;
    --border:    #272729;
    --accent:    #00e676;
    --accent-d:  #00c85a;
    --text:      #d4d4d8;
    --muted:     #52525b;
    --error:     #f87171;
    --ped:       #7dd3fc;
    --mono:      'Cascadia Code','Fira Code','Courier New',monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ──────────────────────────────── */
  #header {
    height: 48px;
    min-height: 48px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
  }

  #brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  #vsep { width: 1px; height: 20px; background: var(--border); }

  #file-label {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    min-width: 200px;
    max-width: 300px;
    overflow: hidden;
    transition: border-color 0.15s;
    white-space: nowrap;
  }
  #file-label:hover { border-color: var(--accent); }
  #file-label span { overflow: hidden; text-overflow: ellipsis; }
  #file-label.ready { color: var(--text); border-color: var(--border); }
  #file-input { display: none; }

  #run-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #run-btn:hover:not(:disabled) { background: var(--accent-d); }
  #run-btn:disabled { background: var(--muted); color: #777; cursor: not-allowed; }

  #clear-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #clear-btn:hover { color: var(--text); border-color: var(--muted); }

  .spacer { flex: 1; }

  #status-wrap { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0; transition: background 0.2s;
  }
  #status-dot.running { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  #status-dot.done    { background: var(--accent); }
  #status-dot.error   { background: var(--error); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  #status-text { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Panel base ──────────────────────────── */
  .panel {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }
  .ph {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    flex-shrink: 0;
  }
  .ph-title {
    font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted);
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ph-count {
    font-size: 10px; color: var(--muted);
    background: var(--border); padding: 1px 6px; border-radius: 10px;
    flex-shrink: 0;
  }
  .ph-actions { display: flex; align-items: center; gap: 6px; margin-left: 8px; flex-shrink: 0; }
  .ph-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 3px;
    width: 22px; height: 18px;
    padding: 0;
    font-size: 12px; line-height: 1;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .ph-btn:hover { color: var(--accent); border-color: var(--accent); }
  .ph-btn-flash { color: var(--accent); border-color: var(--accent); }
  .pb {
    flex: 1; overflow-y: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .pb::-webkit-scrollbar { width: 5px; }
  .pb::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .entry { border-bottom: 1px solid var(--border); padding: 10px 12px; }
  .entry:last-child { border-bottom: none; }
  .entry.err .json-pre { color: var(--error); }

  .ped-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ped);
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .ped-label::before {
    content: ''; display: inline-block;
    width: 6px; height: 6px; border-radius: 50%; background: var(--ped);
  }
  .json-pre { white-space: pre-wrap; word-break: break-all; color: var(--text); }
  .empty { display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); font-size: 12px; font-family: var(--mono); }

  /* ── Fixed grid (Sintáctico, Pedimento, NorContrib, DTA) ── */
  #fixed-grid {
    flex: 3;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 2fr 1fr;
    gap: 1px;
    background: var(--border);
    min-height: 0;
  }

  /* ── Dynamic modules row ─────────────────── */
  #modules-section {
    display: none; /* shown when at least 1 module exists */
    flex: 2;
    flex-direction: row;
    gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
    min-height: 0;
  }
  #modules-section .panel { flex: 1; }

  /* ── Log strip ───────────────────────────── */
  #log-strip {
    flex-shrink: 0;
    height: 80px;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-top: 1px solid var(--border);
    overflow: hidden;
  }
  #log-strip .ph { padding: 4px 12px; }
  #log-out {
    flex: 1; overflow-y: auto; padding: 4px 12px;
    font-family: var(--mono); font-size: 11px; line-height: 1.6;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  #log-out::-webkit-scrollbar { width: 4px; }
  #log-out::-webkit-scrollbar-thumb { background: var(--border); }
  .ll { color: var(--muted); }
  .ll.ok  { color: var(--accent); }
  .ll.err { color: var(--error); }
  .ll.mod { color: var(--ped); padding-left: 10px; border-left: 2px solid var(--border); }

  /* ── Batch mode ─────────────────────────────── */
  #batch-mode-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  #batch-mode-btn:hover { color: var(--text); border-color: var(--muted); }
  #batch-mode-btn.active { color: var(--accent); border-color: var(--accent); }

  #single-view {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  #batch-view {
    display: none;
    flex-direction: column;
  }
  #batch-view.active {
    display: flex;
    min-height: calc(100vh - 48px);
  }

  #batch-header {
    position: sticky;
    top: 48px;
    z-index: 10;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }

  #batch-back-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #batch-back-btn:hover { color: var(--text); border-color: var(--muted); }

  #batch-file-label {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.15s;
  }
  #batch-file-label:hover { border-color: var(--accent); }
  #batch-file-label.ready { color: var(--text); }
  #batch-file-input { display: none; }

  #batch-file-count { font-size: 11px; color: var(--muted); font-family: var(--mono); }

  #batch-run-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  #batch-run-btn:hover:not(:disabled) { background: var(--accent-d); }
  #batch-run-btn:disabled { background: var(--muted); color: #777; cursor: not-allowed; }

  #batch-clear-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #batch-clear-btn:hover { color: var(--text); border-color: var(--muted); }

  #batch-progress { position: sticky; top: calc(48px + 45px); z-index: 9; flex-shrink: 0; height: 3px; background: var(--border); }
  #batch-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

  #batch-results {
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .batch-file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .batch-file-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .batch-file-name { font-size: 12px; font-weight: 700; color: var(--text); font-family: var(--mono); }
  .batch-file-index { font-size: 10px; color: var(--muted); margin-left: auto; }
  .batch-status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .batch-status-dot.processing { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  .batch-status-dot.ok  { background: #22c55e; }
  .batch-status-dot.err { background: var(--error); }

  .batch-modules-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px;
  }

  .batch-mod-ok-card {
    flex: 1 1 100%;
    background: #0a1f10; border: 1px solid #166534; border-radius: 4px; overflow: hidden;
  }
  .batch-mod-ok-header {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(22,101,52,0.3);
    border-bottom: 1px solid #166534;
    font-size: 11px; font-weight: 700; color: #22c55e; font-family: var(--mono);
  }
  .batch-mod-ok-header::before { content: '✓ '; }
  .batch-mod-ok-body { padding: 8px 12px; }
  .batch-mod-ok-body pre {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
  }
  .batch-mod-ok-ped {
    font-size: 10px; font-weight: 700; color: var(--ped);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
  }

  .batch-mod-err-card {
    flex: 1 1 100%;
    background: #1f0a0a; border: 1px solid #7f1d1d; border-radius: 4px; overflow: hidden;
  }
  .batch-mod-err-header {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: rgba(127,29,29,0.3);
    border-bottom: 1px solid #7f1d1d;
    font-size: 11px; font-weight: 700; color: var(--error); font-family: var(--mono);
  }
  .batch-mod-err-header::before { content: '✗ '; }
  .batch-mod-err-body { padding: 8px 12px; }
  .batch-mod-err-ped {
    font-size: 10px; font-weight: 700; color: var(--ped);
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px;
  }
  .batch-mod-err-body pre {
    font-family: var(--mono); font-size: 11px; color: var(--error);
    white-space: pre-wrap; word-break: break-all;
  }

  .batch-file-fatal {
    padding: 8px 14px; font-size: 11px; color: var(--error); font-family: var(--mono);
  }

  #batch-summary-bar {
    flex-shrink: 0;
    display: none;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    background: var(--surface2);
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); font-family: var(--mono);
  }
  #batch-summary-bar.visible { display: flex; }
  .sum-ok  { color: #22c55e; }
  .sum-err { color: var(--error); }
</style>
</head>
<body>

<header id="header">
  <span id="brand">Orquestador</span>
  <div id="vsep"></div>
  <label id="file-label" for="file-input">
    📄 <span id="file-name">Seleccionar archivo...</span>
  </label>
  <input type="file" id="file-input">
  <button id="run-btn" disabled>▶ Ejecutar</button>
  <button id="clear-btn">Limpiar</button>
  <div style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>
  <button id="batch-mode-btn">⊞ Proceso por Lotes</button>
  <div class="spacer"></div>
  <div id="status-wrap">
    <div id="status-dot"></div>
    <span id="status-text">Listo</span>
  </div>
</header>

<!-- ═══ Vista Individual ══════════════════════════════════════ -->
<div id="single-view">

  <!-- Paneles fijos: Sintáctico, Pedimento, NorContribuciones, DTA -->
  <div id="fixed-grid">
    <div class="panel" id="panel-sint">
      <div class="ph"><span class="ph-title">Sintáctico</span><span class="ph-count" id="cnt-sint">0</span></div>
      <div class="pb" id="out-sint"><div class="empty">Sin datos</div></div>
    </div>
    <div class="panel" id="panel-ped">
      <div class="ph"><span class="ph-title">Pedimento</span><span class="ph-count" id="cnt-ped">0</span></div>
      <div class="pb" id="out-ped"><div class="empty">Sin datos</div></div>
    </div>
    <div class="panel" id="panel-nor">
      <div class="ph"><span class="ph-title">NorContribuciones</span><span class="ph-count" id="cnt-nor">0</span></div>
      <div class="pb" id="out-nor"><div class="empty">Sin datos</div></div>
    </div>
    <div class="panel" id="panel-dta">
      <div class="ph"><span class="ph-title">DTA / TCambio</span><span class="ph-count" id="cnt-dta">0</span></div>
      <div class="pb" id="out-dta"><div class="empty">Sin datos</div></div>
    </div>
  </div>

  <!-- Paneles dinámicos: uno por módulo gRPC definido en modulos[] -->
  <div id="modules-section"></div>

  <!-- Bitácora -->
  <div id="log-strip">
    <div class="ph"><span class="ph-title">Bitácora</span><span class="ph-count" id="cnt-log">0</span></div>
    <div id="log-out"></div>
  </div>

</div>

<!-- ═══ Vista Batch ════════════════════════════════════════════ -->
<div id="batch-view">

  <div id="batch-header">
    <button id="batch-back-btn">← Volver</button>
    <div style="width:1px;height:20px;background:var(--border);flex-shrink:0"></div>
    <label id="batch-file-label" for="batch-file-input">
      📂 <span id="batch-file-name">Seleccionar archivos...</span>
    </label>
    <input type="file" id="batch-file-input" multiple>
    <span id="batch-file-count"></span>
    <button id="batch-run-btn" disabled>▶ Procesar Lote</button>
    <button id="batch-clear-btn">Limpiar</button>
  </div>

  <div id="batch-progress"><div id="batch-progress-bar"></div></div>

  <div id="batch-results">
    <div class="empty" id="batch-empty">Selecciona archivos y pulsa "Procesar Lote"</div>
  </div>

  <div id="batch-summary-bar">
    <span>Lote completado:</span>
    <span id="batch-sum-ok" class="sum-ok"></span>
    <span id="batch-sum-err" class="sum-err"></span>
    <span id="batch-sum-total" style="margin-left:auto"></span>
  </div>

</div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);

  // Paneles fijos
  const fixed = {
    sint: { body: $('out-sint'), count: $('cnt-sint'), n: 0, name: 'Sintactico',        entries: [] },
    ped:  { body: $('out-ped'),  count: $('cnt-ped'),  n: 0, name: 'Pedimento',          entries: [] },
    nor:  { body: $('out-nor'),  count: $('cnt-nor'),  n: 0, name: 'NorContribuciones',  entries: [] },
    dta:  { body: $('out-dta'),  count: $('cnt-dta'),  n: 0, name: 'DTA_TCambio',         entries: [] },
  };

  // Paneles dinámicos de módulos: { [moduleName]: { body, count, n } }
  const modPanels = {};

  let sse          = null;
  let selectedFile = null;
  let hadError     = false;
  let logN         = 0;
  let streamDone   = false;

  // ── Estado ──────────────────────────────────────
  function setStatus(text, state) {
    $('status-text').textContent = text;
    $('status-dot').className = state || '';
  }

  // ── Log ─────────────────────────────────────────
  function addLog(text, module) {
    const line = document.createElement('div');
    let cls = 'll';
    if (module) {
      // Log del lado servidor (contenedor del módulo): estilo distinto, sin
      // alterar el estado de error del orquestador.
      cls += ' mod';
      line.textContent = '[' + new Date().toLocaleTimeString() + '] [' + module + '] ' + text;
    } else {
      const isErr = text.startsWith('ERROR');
      const isOk  = text.startsWith('[OK]');
      if (isErr) cls += ' err';
      else if (isOk) cls += ' ok';
      line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + text;
      if (isErr) hadError = true;
    }
    line.className = cls;
    $('log-out').appendChild(line);
    $('log-out').scrollTop = $('log-out').scrollHeight;
    $('cnt-log').textContent = ++logN;
  }

  function clearLog() {
    $('log-out').innerHTML = '';
    $('cnt-log').textContent = '0';
    logN = 0;
  }

  // ── Panel helpers ────────────────────────────────
  function incr(panel) {
    panel.n++;
    panel.count.textContent = panel.n;
  }

  function clearPanel(panel) {
    panel.body.innerHTML = '<div class="empty">Sin datos</div>';
    panel.n = 0;
    panel.count.textContent = '0';
    panel.entries = [];
  }

  function rmEmpty(body) {
    const e = body.querySelector('.empty');
    if (e) e.remove();
  }

  function appendEntry(panel, pedimento, data, isErr) {
    rmEmpty(panel.body);
    const entry = document.createElement('div');
    entry.className = 'entry' + (isErr ? ' err' : '');
    if (pedimento) {
      const lbl = document.createElement('div');
      lbl.className = 'ped-label';
      lbl.textContent = 'Pedimento ' + pedimento;
      entry.appendChild(lbl);
    }
    const pre = document.createElement('pre');
    pre.className = 'json-pre';
    pre.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    entry.appendChild(pre);
    panel.body.appendChild(entry);
    panel.body.scrollTop = panel.body.scrollHeight;
    if (panel.entries) panel.entries.push({ pedimento: pedimento || '', data });
    incr(panel);
  }

  function replacePanel(panel, data) {
    panel.body.innerHTML = '';
    panel.n = 0;
    panel.count.textContent = '0';
    panel.entries = [];
    appendEntry(panel, null, data, false);
  }

  // ── Exportar respuesta de un panel ───────────────
  function panelText(panel) {
    const entries = panel.entries || [];
    if (entries.length === 0) return '';
    if (entries.length === 1 && !entries[0].pedimento) {
      const d = entries[0].data;
      return typeof d === 'string' ? d : JSON.stringify(d, null, 2);
    }
    const out = entries.map(e => e.pedimento ? { pedimento: e.pedimento, data: e.data } : e.data);
    return JSON.stringify(out, null, 2);
  }

  function addPanelControls(panel, headerEl) {
    const actions = document.createElement('div');
    actions.className = 'ph-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'ph-btn';
    copyBtn.title = 'Copiar respuesta al portapapeles';
    copyBtn.textContent = '⧉';
    copyBtn.addEventListener('click', async () => {
      const txt = panelText(panel);
      if (!txt) { flashBtn(copyBtn, '∅'); return; }
      try {
        await navigator.clipboard.writeText(txt);
        flashBtn(copyBtn, '✓');
      } catch (e) {
        flashBtn(copyBtn, '✕');
      }
    });

    const dlBtn = document.createElement('button');
    dlBtn.className = 'ph-btn';
    dlBtn.title = 'Descargar respuesta como JSON';
    dlBtn.textContent = '⭳';
    dlBtn.addEventListener('click', () => {
      const txt = panelText(panel);
      if (!txt) { flashBtn(dlBtn, '∅'); return; }
      const safe = (panel.name || 'panel').replace(/[^A-Za-z0-9_-]+/g, '_');
      const blob = new Blob([txt], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'respuesta_' + safe + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    actions.appendChild(copyBtn);
    actions.appendChild(dlBtn);
    headerEl.appendChild(actions);
  }

  function flashBtn(btn, glyph) {
    const prev = btn.textContent;
    btn.textContent = glyph;
    btn.classList.add('ph-btn-flash');
    setTimeout(() => { btn.textContent = prev; btn.classList.remove('ph-btn-flash'); }, 900);
  }

  // ── Módulos dinámicos ────────────────────────────
  function createModulePanel(name) {
    if (modPanels[name]) return;

    const section = $('modules-section');
    section.style.display = 'flex';

    const wrap  = document.createElement('div');
    wrap.className = 'panel';

    const ph    = document.createElement('div');
    ph.className = 'ph';
    const title = document.createElement('span');
    title.className = 'ph-title';
    title.textContent = name;
    const count = document.createElement('span');
    count.className = 'ph-count';
    count.textContent = '0';
    ph.appendChild(title);
    ph.appendChild(count);

    const body  = document.createElement('div');
    body.className = 'pb';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Sin datos';
    body.appendChild(empty);

    wrap.appendChild(ph);
    wrap.appendChild(body);
    section.appendChild(wrap);

    modPanels[name] = { body, count, n: 0, name, entries: [] };
    addPanelControls(modPanels[name], ph);
  }

  function clearModules() {
    const section = $('modules-section');
    section.style.display = 'none';
    section.innerHTML = '';
    for (const k in modPanels) delete modPanels[k];
  }

  // Botones Copiar/Descargar en los paneles fijos (los dinámicos se cablean al crearse)
  Object.values(fixed).forEach(panel => {
    const header = panel.body.closest('.panel').querySelector('.ph');
    addPanelControls(panel, header);
  });

  // ── Reset completo ───────────────────────────────
  function clearAll() {
    Object.values(fixed).forEach(clearPanel);
    clearModules();
    clearLog();
    hadError = false;
  }

  // ── Fin de ejecución ─────────────────────────────
  function finish(state) {
    if (sse) { sse.close(); sse = null; }
    $('run-btn').disabled = !selectedFile;
    if (state === 'done') {
      streamDone = true;
      setStatus(
        hadError ? 'Completado con errores (ver Bitácora)' : 'Completado',
        hadError ? 'error' : 'done'
      );
    } else if (!streamDone) {
      // onerror real (antes de recibir done)
      addLog('ERROR: conexión SSE interrumpida antes de completar');
      setStatus('Error de conexión', 'error');
    }
    // Si streamDone=true y onerror dispara, es solo el cierre normal del socket — ignorar
  }

  // ── File picker ──────────────────────────────────
  $('file-input').addEventListener('change', () => {
    selectedFile = $('file-input').files[0] || null;
    const lbl = $('file-label');
    if (selectedFile) {
      $('file-name').textContent = selectedFile.name;
      lbl.classList.add('ready');
      $('run-btn').disabled = false;
    } else {
      $('file-name').textContent = 'Seleccionar archivo...';
      lbl.classList.remove('ready');
      $('run-btn').disabled = true;
    }
  });

  // ── Ejecutar ─────────────────────────────────────
  async function startRun() {
    if (!selectedFile) return;
    if (sse) { sse.close(); sse = null; }

    clearAll();
    streamDone = false;
    $('run-btn').disabled = true;
    setStatus('Subiendo archivo...', 'running');

    // 1. Upload → token
    let token;
    try {
      const form = new FormData();
      form.append('file', selectedFile);
      const res = await fetch('/api/upload', { method: 'POST', body: form });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + txt.trim());
      }
      const json = await res.json();
      token = json.token;
      if (!token) throw new Error('servidor no devolvió token');
    } catch (e) {
      addLog('ERROR al subir: ' + e.message);
      setStatus('Error al subir archivo', 'error');
      $('run-btn').disabled = false;
      return;
    }

    addLog('Archivo subido correctamente. Iniciando...');
    setStatus('Procesando...', 'running');

    // 2. SSE stream
    sse = new EventSource('/api/run?token=' + encodeURIComponent(token));

    sse.addEventListener('log', e => {
      const ev = JSON.parse(e.data);
      addLog(ev.data, ev.module);
      // Los logs del contenedor (ev.module) no actualizan la barra de estado.
      if (!ev.module) setStatus(ev.data, hadError ? 'error' : 'running');
    });

    // Lista de módulos → crear paneles antes de recibir resultados
    sse.addEventListener('modules', e => {
      const ev = JSON.parse(e.data);
      if (Array.isArray(ev.data)) {
        ev.data.forEach(createModulePanel);
      }
    });

    // Resultado de un módulo gRPC → panel dinámico correspondiente
    sse.addEventListener('module', e => {
      try {
        const ev = JSON.parse(e.data);
        if (!modPanels[ev.module]) createModulePanel(ev.module);
        const panel = modPanels[ev.module];
        if (!panel) {
          addLog('ERROR: panel no encontrado para módulo ' + ev.module);
          return;
        }
        const isErr = ev.data && ev.data.status === 'error';
        appendEntry(panel, ev.pedimento, ev.data, isErr);
      } catch (err) {
        addLog('ERROR al renderizar módulo: ' + err.message);
      }
    });

    sse.addEventListener('sintactica', e => {
      const ev = JSON.parse(e.data);
      appendEntry(fixed.sint, ev.pedimento, ev.data, false);
    });

    sse.addEventListener('pedimento', e => {
      const ev = JSON.parse(e.data);
      appendEntry(fixed.ped, ev.pedimento, ev.data, false);
    });

    sse.addEventListener('norcontrib', e => {
      const ev = JSON.parse(e.data);
      replacePanel(fixed.nor, ev.data);
    });

    sse.addEventListener('dta', e => {
      const ev = JSON.parse(e.data);
      appendEntry(fixed.dta, ev.pedimento, ev.data, false);
    });

    sse.addEventListener('done', () => finish('done'));
    sse.onerror = () => finish('error');
  }

  $('run-btn').addEventListener('click', startRun);
  $('clear-btn').addEventListener('click', () => {
    if (sse) { sse.close(); sse = null; }
    $('run-btn').disabled = !selectedFile;
    clearAll();
    setStatus('Listo', '');
  });

  // ══════════════════════════════════════════════════════════════
  // BATCH MODE
  // ══════════════════════════════════════════════════════════════

  const batch = {
    files: null,
    sse: null,
    done: false,
    total: 0,
    processed: 0,
    okCount: 0,
    errCount: 0,
    cards: {},
  };

  function showBatchView() {
    document.body.style.height = 'auto';
    document.body.style.overflowY = 'auto';
    $('single-view').style.display = 'none';
    $('batch-view').classList.add('active');
    $('batch-mode-btn').classList.add('active');
  }

  function showSingleView() {
    document.body.style.height = '100vh';
    document.body.style.overflowY = 'hidden';
    $('batch-view').classList.remove('active');
    $('single-view').style.display = 'flex';
    $('batch-mode-btn').classList.remove('active');
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function createFileCard(fileName, index, total) {
    const card = document.createElement('div');
    card.className = 'batch-file-card';
    card.innerHTML =
      '<div class="batch-file-header">' +
        '<div class="batch-status-dot processing"></div>' +
        '<span class="batch-file-name">' + escHtml(fileName) + '</span>' +
        '<span class="batch-file-index">' + index + ' / ' + total + '</span>' +
      '</div>' +
      '<div class="batch-modules-row"></div>';
    batch.cards[fileName] = card;
    $('batch-results').appendChild(card);
    $('batch-results').scrollTop = $('batch-results').scrollHeight;
    return card;
  }

  function renderFileDone(summary, fatalError) {
    const card = batch.cards[summary.file_name];
    if (!card) return;
    const dot = card.querySelector('.batch-status-dot');
    const row = card.querySelector('.batch-modules-row');
    row.innerHTML = '';

    let fileHasErr = !!fatalError;

    if (fatalError) {
      const fatal = document.createElement('div');
      fatal.className = 'batch-file-fatal';
      fatal.textContent = '✗ Error fatal: ' + fatalError;
      row.appendChild(fatal);
    } else if (summary.modules) {
      summary.modules.forEach(mod => {
        const isErr = mod.overall_status === 'error';
        if (isErr) fileHasErr = true;

        const cardClass  = isErr ? 'batch-mod-err-card'   : 'batch-mod-ok-card';
        const hdrClass   = isErr ? 'batch-mod-err-header'  : 'batch-mod-ok-header';
        const bodyClass  = isErr ? 'batch-mod-err-body'    : 'batch-mod-ok-body';
        const pedClass   = isErr ? 'batch-mod-err-ped'     : 'batch-mod-ok-ped';
        const results    = isErr
          ? (mod.results || []).filter(r => r.status === 'error')
          : (mod.results || []);

        const card = document.createElement('div');
        card.className = cardClass;

        const hdr = document.createElement('div');
        hdr.className = hdrClass;
        hdr.appendChild(document.createTextNode(mod.module));
        card.appendChild(hdr);

        const body = document.createElement('div');
        body.className = bodyClass;

        results.forEach(r => {
          if (r.pedimento) {
            const pedLbl = document.createElement('div');
            pedLbl.className = pedClass;
            pedLbl.textContent = 'Pedimento ' + r.pedimento;
            body.appendChild(pedLbl);
          }
          const pre = document.createElement('pre');
          pre.textContent = typeof r.data === 'string'
            ? r.data
            : JSON.stringify(r.data, null, 2);
          body.appendChild(pre);
        });

        card.appendChild(body);
        row.appendChild(card);
      });
    }

    dot.classList.remove('processing');
    dot.classList.add(fileHasErr ? 'err' : 'ok');
    return fileHasErr;
  }

  function clearBatchResults() {
    if (batch.sse) { batch.sse.close(); batch.sse = null; }
    batch.done = false;
    batch.processed = 0;
    batch.okCount = 0;
    batch.errCount = 0;
    batch.cards = {};
    $('batch-results').innerHTML = '<div class="empty" id="batch-empty">Selecciona archivos y pulsa "Procesar Lote"</div>';
    $('batch-progress-bar').style.width = '0%';
    $('batch-summary-bar').classList.remove('visible');
  }

  async function startBatch() {
    if (!batch.files || batch.files.length === 0) return;
    if (batch.sse) { batch.sse.close(); batch.sse = null; }

    clearBatchResults();

    $('batch-run-btn').disabled = true;
    setStatus('Subiendo archivos...', 'running');

    let token;
    try {
      const form = new FormData();
      for (const f of batch.files) form.append('files', f);
      const res = await fetch('/api/batch-upload', { method: 'POST', body: form });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + txt.trim());
      }
      const json = await res.json();
      token = json.token;
      batch.total = json.count;
      if (!token) throw new Error('servidor no devolvió token');
    } catch (e) {
      setStatus('Error al subir: ' + e.message, 'error');
      $('batch-run-btn').disabled = false;
      return;
    }

    const emptyEl = $('batch-empty');
    if (emptyEl) emptyEl.remove();

    setStatus('Procesando 0 / ' + batch.total + '...', 'running');

    batch.sse = new EventSource('/api/batch-run?token=' + encodeURIComponent(token));

    batch.sse.addEventListener('batch_file_start', e => {
      const ev = JSON.parse(e.data);
      const d = ev.data;
      createFileCard(d.file_name, d.index, d.total);
      setStatus('Procesando ' + d.index + ' / ' + d.total + ': ' + d.file_name, 'running');
    });

    batch.sse.addEventListener('batch_file_done', e => {
      const ev = JSON.parse(e.data);
      const d = ev.data;
      batch.processed++;
      const hadErr = renderFileDone(d.summary, d.error || '');
      if (hadErr) batch.errCount++; else batch.okCount++;
      const pct = Math.round((batch.processed / batch.total) * 100);
      $('batch-progress-bar').style.width = pct + '%';
      setStatus('Procesando ' + batch.processed + ' / ' + batch.total + '...', 'running');
    });

    batch.sse.addEventListener('batch_done', () => {
      batch.done = true;
      if (batch.sse) { batch.sse.close(); batch.sse = null; }
      $('batch-run-btn').disabled = false;
      $('batch-progress-bar').style.width = '100%';

      const bar = $('batch-summary-bar');
      bar.classList.add('visible');
      $('batch-sum-ok').textContent  = '✓ ' + batch.okCount + ' OK';
      $('batch-sum-err').textContent = batch.errCount > 0 ? '✗ ' + batch.errCount + ' con errores' : '';
      $('batch-sum-total').textContent = batch.total + ' archivos totales';

      setStatus(
        batch.errCount > 0
          ? 'Lote completo: ' + batch.okCount + ' OK, ' + batch.errCount + ' con errores'
          : 'Lote completado: ' + batch.total + ' archivos OK',
        batch.errCount > 0 ? 'error' : 'done'
      );
    });

    batch.sse.addEventListener('done', () => {
      if (!batch.done) {
        if (batch.sse) { batch.sse.close(); batch.sse = null; }
        $('batch-run-btn').disabled = false;
        setStatus('Stream cerrado inesperadamente', 'error');
      }
    });

    batch.sse.onerror = () => {
      if (!batch.done) {
        setStatus('Error de conexión SSE', 'error');
        $('batch-run-btn').disabled = false;
      }
    };
  }

  $('batch-mode-btn').addEventListener('click', showBatchView);
  $('batch-back-btn').addEventListener('click', showSingleView);
  $('batch-run-btn').addEventListener('click', startBatch);

  $('batch-file-input').addEventListener('change', () => {
    batch.files = $('batch-file-input').files;
    const n = batch.files ? batch.files.length : 0;
    if (n > 0) {
      $('batch-file-name').textContent = n === 1 ? batch.files[0].name : n + ' archivos seleccionados';
      $('batch-file-label').classList.add('ready');
      $('batch-file-count').textContent = '';
      $('batch-run-btn').disabled = false;
    } else {
      $('batch-file-name').textContent = 'Seleccionar archivos...';
      $('batch-file-label').classList.remove('ready');
      $('batch-run-btn').disabled = true;
    }
  });

  $('batch-clear-btn').addEventListener('click', () => {
    clearBatchResults();
    batch.files = null;
    $('batch-file-input').value = '';
    $('batch-file-name').textContent = 'Seleccionar archivos...';
    $('batch-file-label').classList.remove('ready');
    $('batch-run-btn').disabled = true;
    setStatus('Listo', '');
  });

})();
</script>
</body>
</html>
