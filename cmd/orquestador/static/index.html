<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orquestador</title>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #141416;
    --surface2: #1c1c1f;
    --border: #272729;
    --accent: #00e676;
    --accent-dim: #00c85a;
    --text: #d4d4d8;
    --muted: #52525b;
    --error: #f87171;
    --warn: #fbbf24;
    --ped-color: #7dd3fc;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    --header-h: 48px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ─────────────────────────────────────── */
  #header {
    height: var(--header-h);
    min-height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    flex-shrink: 0;
  }

  #brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    white-space: nowrap;
  }

  #sep { width: 1px; height: 20px; background: var(--border); }

  #file-select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    font-size: 13px;
    border-radius: 4px;
    outline: none;
    cursor: pointer;
    min-width: 180px;
  }
  #file-select:focus { border-color: var(--accent); }

  #run-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.15s;
    white-space: nowrap;
  }
  #run-btn:hover:not(:disabled) { background: var(--accent-dim); }
  #run-btn:disabled { background: var(--muted); color: #888; cursor: not-allowed; }

  #clear-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #clear-btn:hover { color: var(--text); border-color: var(--muted); }

  .spacer { flex: 1; }

  #status-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }

  #status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  #status-dot.running { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
  #status-dot.done    { background: var(--accent); animation: none; }
  #status-dot.error   { background: var(--error); animation: none; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

  #status-text { max-width: 340px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Grid ───────────────────────────────────────── */
  #grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }

  .panel {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #panel-norcontrib { grid-column: 3; grid-row: 1 / 3; }
  #panel-dta        { grid-column: 1 / 3; grid-row: 2; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    flex-shrink: 0;
  }

  .panel-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .panel-count {
    font-size: 10px;
    color: var(--muted);
    background: var(--border);
    padding: 1px 6px;
    border-radius: 10px;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.55;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Panel content blocks ─────────────────────── */
  .entry {
    border-bottom: 1px solid var(--border);
    padding: 10px 12px;
  }
  .entry:last-child { border-bottom: none; }

  .ped-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ped-color);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ped-label::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ped-color);
  }

  .json-pre {
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--font-mono);
  }

  .entry-error .json-pre { color: var(--error); }
</style>
</head>
<body>

<header id="header">
  <span id="brand">Orquestador</span>
  <div id="sep"></div>
  <select id="file-select"><option value="">Cargando archivos...</option></select>
  <button id="run-btn">▶ Ejecutar</button>
  <button id="clear-btn">Limpiar</button>
  <div class="spacer"></div>
  <div id="status-wrap">
    <div id="status-dot"></div>
    <span id="status-text">Listo</span>
  </div>
</header>

<main id="grid">
  <section class="panel" id="panel-sintactica">
    <div class="panel-header">
      <span class="panel-title">Sintáctico</span>
      <span class="panel-count" id="cnt-sintactica">0</span>
    </div>
    <div class="panel-body" id="out-sintactica">
      <div class="empty-state">Sin datos</div>
    </div>
  </section>

  <section class="panel" id="panel-simplificados">
    <div class="panel-header">
      <span class="panel-title">Simplificados</span>
      <span class="panel-count" id="cnt-simplificados">0</span>
    </div>
    <div class="panel-body" id="out-simplificados">
      <div class="empty-state">Sin datos</div>
    </div>
  </section>

  <section class="panel" id="panel-norcontrib">
    <div class="panel-header">
      <span class="panel-title">NorContribuciones</span>
      <span class="panel-count" id="cnt-norcontrib">0</span>
    </div>
    <div class="panel-body" id="out-norcontrib">
      <div class="empty-state">Sin datos</div>
    </div>
  </section>

  <section class="panel" id="panel-dta">
    <div class="panel-header">
      <span class="panel-title">DTA / TCambio</span>
      <span class="panel-count" id="cnt-dta">0</span>
    </div>
    <div class="panel-body" id="out-dta">
      <div class="empty-state">Sin datos</div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const fileSelect  = $('file-select');
  const runBtn      = $('run-btn');
  const clearBtn    = $('clear-btn');
  const statusDot   = $('status-dot');
  const statusText  = $('status-text');

  const panels = {
    sintactica:    { body: $('out-sintactica'),    count: $('cnt-sintactica'),    n: 0 },
    simplificados: { body: $('out-simplificados'), count: $('cnt-simplificados'), n: 0 },
    norcontrib:    { body: $('out-norcontrib'),     count: $('cnt-norcontrib'),     n: 0 },
    dta:           { body: $('out-dta'),            count: $('cnt-dta'),            n: 0 },
  };

  let currentSSE = null;

  // ── Helpers ───────────────────────────────────────
  function setStatus(text, state) {
    statusText.textContent = text;
    statusDot.className = state || '';
  }

  function incrCount(key) {
    panels[key].n++;
    panels[key].count.textContent = panels[key].n;
  }

  function clearPanel(key) {
    panels[key].body.innerHTML = '<div class="empty-state">Sin datos</div>';
    panels[key].n = 0;
    panels[key].count.textContent = '0';
  }

  function clearAll() {
    Object.keys(panels).forEach(clearPanel);
  }

  function removeEmpty(body) {
    const empty = body.querySelector('.empty-state');
    if (empty) empty.remove();
  }

  function appendEntry(key, pedimento, data, isError) {
    const p = panels[key];
    removeEmpty(p.body);

    const entry = document.createElement('div');
    entry.className = 'entry' + (isError ? ' entry-error' : '');

    if (pedimento) {
      const label = document.createElement('div');
      label.className = 'ped-label';
      label.textContent = 'Pedimento ' + pedimento;
      entry.appendChild(label);
    }

    const pre = document.createElement('pre');
    pre.className = 'json-pre';
    pre.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    entry.appendChild(pre);

    p.body.appendChild(entry);
    p.body.scrollTop = p.body.scrollHeight;
    incrCount(key);
  }

  function replacePanel(key, data) {
    panels[key].body.innerHTML = '';
    panels[key].n = 0;
    panels[key].count.textContent = '0';
    appendEntry(key, null, data, false);
  }

  // ── File loader ───────────────────────────────────
  async function loadFiles() {
    try {
      const res = await fetch('/api/files');
      const files = await res.json();
      fileSelect.innerHTML = '';
      if (!files || files.length === 0) {
        fileSelect.innerHTML = '<option value="">No hay archivos m*</option>';
        return;
      }
      files.forEach(f => {
        const opt = document.createElement('option');
        opt.value = opt.textContent = f;
        fileSelect.appendChild(opt);
      });
    } catch (e) {
      fileSelect.innerHTML = '<option value="">Error al cargar</option>';
    }
  }

  // ── SSE run ───────────────────────────────────────
  function startRun() {
    const file = fileSelect.value;
    if (!file) return;

    if (currentSSE) {
      currentSSE.close();
      currentSSE = null;
    }

    clearAll();
    runBtn.disabled = true;
    setStatus('Iniciando...', 'running');

    const url = '/api/run?file=' + encodeURIComponent(file);
    const sse = new EventSource(url);
    currentSSE = sse;

    sse.addEventListener('log', e => {
      const ev = JSON.parse(e.data);
      setStatus(ev.data, 'running');
    });

    sse.addEventListener('sintactica', e => {
      const ev = JSON.parse(e.data);
      appendEntry('sintactica', ev.pedimento, ev.data, false);
    });

    sse.addEventListener('simplificados', e => {
      const ev = JSON.parse(e.data);
      const isErr = ev.data && ev.data.status === 'error';
      appendEntry('simplificados', ev.pedimento, ev.data, isErr);
    });

    sse.addEventListener('norcontrib', e => {
      const ev = JSON.parse(e.data);
      replacePanel('norcontrib', ev.data);
    });

    sse.addEventListener('dta', e => {
      const ev = JSON.parse(e.data);
      appendEntry('dta', ev.pedimento, ev.data, false);
    });

    sse.addEventListener('done', () => {
      sse.close();
      currentSSE = null;
      runBtn.disabled = false;
      setStatus('Completado', 'done');
    });

    sse.onerror = () => {
      if (sse.readyState === EventSource.CLOSED) {
        currentSSE = null;
        runBtn.disabled = false;
        if (statusDot.className !== 'done') {
          setStatus('Conexión cerrada', 'error');
        }
      }
    };
  }

  // ── Event listeners ───────────────────────────────
  runBtn.addEventListener('click', startRun);
  clearBtn.addEventListener('click', () => {
    if (currentSSE) { currentSSE.close(); currentSSE = null; runBtn.disabled = false; }
    clearAll();
    setStatus('Listo', '');
  });

  // ── Init ──────────────────────────────────────────
  loadFiles();
})();
</script>
</body>
</html>
